<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h1>Expense Tracker</h1>
        <div class="nav-links">
            <a href="income.html">Add Income</a>
            <a href="expense.html">Add Expense</a>
            <a href="records.html">Records</a>
            <a href="profile.html">Profile</a>
        </div>
    </nav>
    <div class="container">
        <div class="dashboard-cards">
            <div class="card balance-card">
                <h2>Remaining Balance</h2>
                <p id="balance">₹0</p>
            </div>
            <div class="card income-card">
                <h2>Total Income</h2>
                <p id="totalIncome">₹0</p>
            </div>
            <div class="card expense-card">
                <h2>Total Expenses</h2>
                <p id="totalExpense">₹0</p>
            </div>
        </div>
        <div class="recent-transactions">
            <h2>Recent Transactions</h2>
            <div id="recentTransactions"></div>
        </div>
    </div>
    <script src="app.js"></script>
    <footer style="padding:14px;text-align:center;font-size:12px;color:#888;">
      Built by <a href="https://github.com/deva2006-raut">Devanshu Raut</a> · <a href="https://www.linkedin.com/in/devanshu-raut-632167334/">LinkedIn</a>
    </footer>
</body>
</html>
